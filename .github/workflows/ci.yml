name: CI

on:
  push:
  pull_request:

# CI only reads the repository.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No version input: pnpm/action-setup reads the `packageManager` field
      # (pnpm@12.10.1) from the root package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests use an in-memory KV stub and need no local files.
      - name: Test
        run: pnpm --filter frequi-terminal test

      - name: Build
        run: pnpm --filter frequi-terminal build

      - name: Typecheck worker
        run: pnpm --filter frequi-terminal typecheck:worker

      # Validates the worker bundle, assets and vars without deploying.
      # The placeholder KV id in wrangler.jsonc is fine for a dry run.
      - name: Verify worker bundle
        run: pnpm --filter frequi-terminal exec wrangler deploy --dry-run
