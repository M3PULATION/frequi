services:
  terminal:
    build: .
    image: frequi-terminal:prod
    container_name: frequi-terminal
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3001:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      BOTS_FILE: /config/bots.local.json
    volumes:
      - ./terminal/bots.local.json:/config/bots.local.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 15s
    mem_limit: 512m
